[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-rating"
version = "2.0.0"
description = "Up-to-date UFC dataset (fights, rounds, judges, odds, official rankings) and the fight-outcome models and division rankings built on it"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Theophile Nadiedjoa" }]
keywords = ["ufc", "mma", "dataset", "ufcstats", "elo", "ranking", "machine-learning", "sports-analytics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "kaggle>=1.6",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7", "seaborn>=0.12"]
scrape = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
ufc-rating = "ufc_rating.pipeline:main"

[project.urls]
Repository = "https://github.com/nadiedjoa-24/Rating-UFC"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
